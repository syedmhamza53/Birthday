<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, My Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff1f3;
    --bg2: #fde2e8;
    --rose: #d9607a;
    --rose-deep: #b8405c;
    --blush: #f7c6cf;
    --cream: #fffaf5;
    --ink: #5a3340;
    --ink-soft: #8a6270;
    --gold: #e0b36a;
    --card: rgba(255, 252, 249, 0.86);
    --shadow: 0 18px 50px rgba(184, 64, 92, 0.18);
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --script: "Great Vibes", "Snell Roundhand", "Brush Script MT", cursive;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--serif);
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2) 60%, #f9d3dc);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Floating hearts (decorative) */
  #hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  #hearts span {
    position: absolute;
    bottom: -40px;
    color: var(--rose);
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .25; }
    90%  { opacity: .15; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  #stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }

  .page {
    display: none;
    width: 100%;
    max-width: 760px;
    text-align: center;
  }
  .page.active { display: block; animation: enter .7s ease both; }
  .page.leaving { display: block; animation: leave .3s ease both; }

  @keyframes enter { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes leave { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

  .eyebrow {
    font-size: .95rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--rose-deep);
    margin-bottom: .6rem;
  }

  h1.script, h2.script {
    font-family: var(--script);
    font-weight: 400;
    color: var(--rose-deep);
    line-height: 1.1;
  }
  h1.script { font-size: clamp(2.6rem, 11vw, 4.6rem); }
  h2.script { font-size: clamp(2.2rem, 8vw, 3.4rem); margin-bottom: .4rem; }

  .subtitle {
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    font-style: italic;
    color: var(--ink-soft);
    margin: .6rem 0 1.6rem;
  }

  /* Countdown */
  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 520px;
    margin: 0 auto;
  }
  .unit {
    background: var(--card);
    border-radius: 18px;
    padding: 16px 4px 12px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(217, 96, 122, .15);
  }
  .unit b {
    display: block;
    font-size: clamp(1.9rem, 9vw, 3.2rem);
    font-weight: 600;
    color: var(--rose-deep);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .unit small {
    display: block;
    margin-top: 8px;
    font-size: clamp(.7rem, 2.6vw, .9rem);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .cd-msg {
    min-height: 3.2em;
    margin: 1.6rem auto 0;
    max-width: 460px;
    font-size: clamp(1.15rem, 4.2vw, 1.5rem);
    font-style: italic;
    color: var(--rose-deep);
    line-height: 1.4;
    transition: opacity .6s ease, transform .6s ease;
  }
  .cd-msg.fade { opacity: 0; transform: translateY(6px); }
  .unit.pulse b { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); } }

  /* Cake */
  #celebration { display: none; }
  #celebration.show { display: block; animation: enter .9s ease both; }

  .cake-wrap { width: min(86vw, 400px); margin: 0 auto; }
  .cake-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }

  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .5s ease-in-out infinite alternate; transition: opacity .35s ease; }
  .candle:nth-child(2n) .flame { animation-duration: .42s; }
  .candle:nth-child(3n) .flame { animation-duration: .6s; }
  @keyframes flicker {
    from { transform: scale(1, 1) rotate(-3deg); }
    to   { transform: scale(.92, 1.1) rotate(3deg); }
  }
  .glow { transition: opacity .35s ease; animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .35; } to { opacity: .6; } }

  .candle.puff .flame { animation: lean .3s ease-in forwards; }
  @keyframes lean { to { transform: skewX(-35deg) scale(.7, .8); opacity: .7; } }
  .candle.out .flame, .candle.out .glow { opacity: 0; animation: none; }

  .smoke { opacity: 0; fill: none; stroke: #b7a3aa; stroke-width: 2.2; stroke-linecap: round; }
  .candle.out .smoke { animation: smoke 1.8s ease-out forwards; }
  @keyframes smoke {
    0%   { opacity: 0; transform: translateY(0); }
    20%  { opacity: .75; }
    100% { opacity: 0; transform: translateY(-26px); }
  }

  .hb-text {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.2s ease, transform 1.2s ease;
    margin-top: 1rem;
  }
  .hb-text.show { opacity: 1; transform: none; }
  .hb-text .script { font-size: clamp(3rem, 14vw, 5.6rem); }

  /* Letter pages */
  .letter {
    background: var(--card);
    border: 1px solid rgba(217, 96, 122, .18);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: clamp(24px, 6vw, 56px) clamp(20px, 6vw, 60px);
    text-align: left;
    position: relative;
  }
  .letter::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(224, 179, 106, .45);
    border-radius: 16px;
    pointer-events: none;
  }
  .letter .head { text-align: center; margin-bottom: 1.2rem; }
  .letter .ornament { color: var(--gold); letter-spacing: .5em; font-size: .9rem; }
  .letter p {
    font-size: clamp(1.1rem, 3.9vw, 1.35rem);
    line-height: 1.7;
    margin-bottom: 1.05em;
    color: var(--ink);
  }
  .letter p.salutation { font-style: italic; color: var(--rose-deep); }
  .letter p.signoff { text-align: right; font-style: italic; margin-top: 1.4em; margin-bottom: 0; color: var(--rose-deep); }
  .letter p.signoff .script { display: block; font-size: clamp(1.3rem, 4.5vw, 1.7rem); font-style: normal; margin-top: .1em; }

  .progress {
    margin-top: 1rem;
    font-size: .9rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 1.4rem;
  }
  .btn {
    font-family: var(--serif);
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: .06em;
    border: none;
    border-radius: 999px;
    padding: 13px 30px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color: #fff;
    box-shadow: 0 10px 24px rgba(184, 64, 92, .3);
    transition: transform .2s ease, box-shadow .2s ease;
    min-height: 48px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(184, 64, 92, .36); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .btn.ghost {
    background: rgba(255, 255, 255, .75);
    color: var(--rose-deep);
    border: 1.5px solid var(--rose);
    box-shadow: none;
  }
  #next1 { opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity 1s ease, transform 1s ease; margin-top: 1.4rem; }
  #next1.show { opacity: 1; pointer-events: auto; transform: none; }

  /* Envelope */
  .envelope {
    position: relative;
    display: block;
    width: min(86vw, 380px);
    aspect-ratio: 3 / 2;
    margin: 4.2rem auto 1.5rem;
    background: none;
    border: none;
    cursor: pointer;
    perspective: 1000px;
    -webkit-tap-highlight-color: transparent;
  }
  .envelope:focus-visible { outline: 3px solid var(--gold); outline-offset: 8px; border-radius: 10px; }
  .env-back { position: absolute; inset: 0; background: #f1aebc; border-radius: 10px; box-shadow: var(--shadow); }
  .env-paper {
    position: absolute;
    left: 7%; right: 7%; top: 8%; height: 86%;
    background: var(--cream);
    border-radius: 6px;
    box-shadow: 0 4px 14px rgba(184, 64, 92, .2);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    z-index: 2;
    transition: transform 1s ease .55s;
  }
  .env-paper .script { font-family: var(--script); color: var(--rose-deep); font-size: clamp(1.8rem, 8vw, 2.6rem); }
  .env-paper small { letter-spacing: .25em; text-transform: uppercase; color: var(--ink-soft); font-size: .75rem; margin-top: .4rem; }
  .env-front {
    position: absolute; inset: 0; z-index: 3;
    background: #f7c6cf;
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
    border-radius: 10px;
  }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 56%;
    background: #e8929f;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .6s ease, z-index 0s .3s;
    z-index: 4;
    border-radius: 10px 10px 0 0;
  }
  .env-seal {
    position: absolute; left: 50%; top: 44%; z-index: 5;
    transform: translate(-50%, -50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--rose-deep); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .2);
    transition: opacity .3s ease;
    animation: beat 1.4s ease-in-out infinite;
  }
  @keyframes beat { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.12); } }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 1; }
  .envelope.open .env-seal { opacity: 0; animation: none; }
  .envelope.open .env-paper { transform: translateY(-58%); }
  .env-hint { transition: opacity .5s ease; }
  .env-hint.hide { opacity: 0; }
  #next2, #prev2 { transition: opacity 1s ease, transform 1s ease; }
  #next2 { opacity: 0; pointer-events: none; transform: translateY(8px); }
  #next2.show { opacity: 1; pointer-events: auto; transform: none; }

  /* Desktop refinements */
  @media (min-width: 768px) {
    .countdown { gap: 18px; max-width: 640px; }
    .unit { padding: 24px 6px 18px; border-radius: 22px; }
    .cake-wrap { width: 440px; }
    .nav { gap: 18px; margin-top: 2rem; }
    .btn { padding: 14px 40px; }
    #stage { padding-top: 40px; padding-bottom: 40px; }
  }

  /* Small phones */
  @media (max-width: 360px) {
    .countdown { gap: 6px; }
    .btn { padding: 12px 22px; font-size: 1.05rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    #hearts { display: none; }
  }
</style>
</head>
<body>

<div id="hearts" aria-hidden="true"></div>

<main id="stage">

  <!-- PAGE 1: Countdown + Cake -->
  <section class="page" id="page-0" aria-label="Birthday countdown">
    <div id="countdownBlock">
      <p class="eyebrow">Something special is coming</p>
      <h1 class="script">Counting down to your day</h1>
      <p class="subtitle">Every second brings us closer to celebrating you.</p>
      <div class="countdown" role="timer" aria-live="off">
        <div class="unit"><b id="cd-days">00</b><small>Days</small></div>
        <div class="unit"><b id="cd-hours">00</b><small>Hours</small></div>
        <div class="unit"><b id="cd-mins">00</b><small>Minutes</small></div>
        <div class="unit"><b id="cd-secs">00</b><small>Seconds</small></div>
      </div>
      <p class="cd-msg" id="cdMsg" aria-live="polite"></p>
    </div>

    <div id="celebration">
      <div class="cake-wrap">
        <svg viewBox="0 0 300 260" role="img" aria-label="A birthday cake with candles">
          <!-- plate -->
          <ellipse cx="150" cy="232" rx="135" ry="15" fill="#f1d9de"/>
          <ellipse cx="150" cy="228" rx="135" ry="15" fill="#fff5f6"/>
          <!-- bottom tier -->
          <rect x="40" y="150" width="220" height="74" rx="14" fill="#f7c6cf"/>
          <path d="M40 158 q10 14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 V150 H40Z" fill="#fffaf5"/>
          <circle cx="75" cy="190" r="5" fill="#d9607a" opacity=".7"/>
          <circle cx="110" cy="205" r="5" fill="#e0b36a" opacity=".8"/>
          <circle cx="150" cy="190" r="5" fill="#d9607a" opacity=".7"/>
          <circle cx="190" cy="205" r="5" fill="#e0b36a" opacity=".8"/>
          <circle cx="225" cy="190" r="5" fill="#d9607a" opacity=".7"/>
          <!-- top tier -->
          <rect x="70" y="100" width="160" height="54" rx="12" fill="#fbd9df"/>
          <path d="M70 108 q10 14 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 V100 H70Z" fill="#fffaf5"/>
          <path d="M138 132 c0 -6 -8 -8 -8 -14 c6 0 8 4 8 4 c0 0 2 -4 8 -4 c0 6 -8 8 -8 14Z" fill="#d9607a" opacity=".75" transform="translate(12 4)"/>
          <!-- candles are inserted here by script -->
          <g id="candles"></g>
        </svg>
      </div>
      <div class="hb-text" id="hbText">
        <h2 class="script">Happy Birthday</h2>
        <p class="subtitle" id="hbName"></p>
      </div>
      <button class="btn" id="next1" type="button">Next</button>
    </div>
  </section>

  <!-- PAGE 2: Envelope -->
  <section class="page" id="page-1" aria-label="A love letter for you">
    <p class="eyebrow">A little something for you</p>
    <h2 class="script">You have a love letter</h2>
    <button class="envelope" id="envelope" type="button" aria-label="Open the love letter">
      <div class="env-back"></div>
      <div class="env-paper"><span class="script" id="envTo"></span><small>With love</small></div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="env-seal">&#9829;</div>
    </button>
    <p class="subtitle env-hint" id="envHint">Tap the envelope to open it</p>
    <div class="nav">
      <button class="btn ghost" id="prev2" type="button">Previous</button>
      <button class="btn" id="next2" type="button">Read my letters</button>
    </div>
  </section>

  <!-- Letter pages are generated by script below -->

</main>

<script>
/* ==========================================================
   EDIT THESE VALUES
   ========================================================== */

// Her birthday: local date and time, format YYYY-MM-DDTHH:MM:SS
// (If this moment is already in the past, the cake appears right away.)
const BIRTHDAY_DATE = "2026-11-22T00:00:00";

// Names used inside the letters
const HER_NAME  = "My Love🩷";   // e.g. "Sara"
const YOUR_NAME = "Your Love❤️";     // e.g. "Hamza"

// Letters. Use {her} and {me} where you want the names inserted.
// Add your own real memories in any paragraph; keep each paragraph as one string.
const LETTERS = [
  {
    title: "My Dearest",
    paragraphs: [
      "Dear {her}, 💖",
      "Happy Birthday! 🎂🎉 Today the world celebrates the day you arrived in it, and I find myself quietly grateful to whatever brought you into my life. 🥰 Some people spend years searching for a place that feels like home. You became that place for me, and I did not even have to look for a map. 🏡💕",
      "There is a gentleness in the way you move through the world that I admire more than I can say. 🌸 You make ordinary moments feel softer and brighter. A simple morning, a quiet evening, a few words shared over nothing at all, all of them become something I want to keep because you are in them. ✨",
      "When I think of love, I no longer think of grand speeches or perfect scenes. I think of the calm that settles over me when you are near, the way my heart lifts when I hear your voice, and how easily I find myself smiling when your name crosses my mind. 😊💗 That is what you have given me, and it is a gift I carry everywhere.",
      "So on your birthday, I want you to know this above everything else: you are deeply, truly loved. 💞 Not for what you do, not for what you give, but simply for who you are. 🌹",
      "With all my heart, ❤️"
    ],
    sign: true
  },
  {
    title: "Thank You, My Love",
    paragraphs: [
      "My darling {her}, 💝",
      "No matter how many times I say thank you, it will never be enough, because you deserve so much more than just a thank you. ❤️ Thank you for your patience on the days when I am less than my best. Thank you for your kindness, which never seems to run out. Thank you for believing in me quietly, even when I forget to believe in myself. 🤍",
      "Love is built from small things, and you build it so beautifully. 🧸 It is in the way you listen, the way you care, and the way you make room for me in your world. You have taught me that being loved well is not about perfection. It is about being understood, and you understand me in ways I did not know I needed. 💕",
      "Looking back, I realize how much brighter my life has become since you stepped into it. 🌅 Things that once felt heavy now feel lighter, and things that once felt ordinary now feel like small miracles. I am a better, calmer and happier person because of you, and I hope you can feel how sincerely I mean that. 😍",
      "Please know that every effort you make, seen or unseen, has mattered to me. I notice. I am thankful. 🌷 And I will spend my life trying to deserve the love you so generously give. 💖",
      "Forever grateful, 💋"
    ],
    sign: true
  },
  {
    title: "Our Tomorrow",
    paragraphs: [
      "To the woman I dream beside, {her}, 🌙💫",
      "When I imagine the future, you are in every picture. 🖼️ I imagine us growing older together, learning each other in new ways each year, and still finding reasons to laugh at the smallest things. 😂💞 I imagine a home filled with warmth, where we are each other's safe place no matter what the world outside looks like. 🏠❤️",
      "I hope we always choose kindness with one another, especially when it is hard. I hope we keep talking, keep listening, and keep reaching for each other's hand on both the bright days and the difficult ones. 🤝 I hope we stay curious about who we are becoming, and that we become it together. 🌱💗",
      "I do not know everything the years will bring, but I know I want to face them with you. Your strength steadies me, and your tenderness softens me. 🥺 With you beside me, the unknown feels less like something to fear and more like an adventure we are lucky to share. 🌍✨",
      "My promise to you is simple but heartfelt: I’ll always value you, stand by you, support you in every step of life, and keep choosing you, not just today, but every day that follows. 💍💖",
      "Always yours, 😘"
    ],
    sign: true
  },
  {
    title: "One More Thing",
    closing: true,
    paragraphs: [
      "Happy Birthday, {her}. 🎂💐🎈",
      "May this beautiful new year of your life bring you endless happiness, peace, love, and countless reasons to smile. 🌸✨ May your dreams come true, your silent prayers be answered, and your heart always find reasons to feel grateful and hopeful. You deserve all the beautiful things life has to offer and so much more. ❤️",
      "Whatever this year brings, always remember that there is someone who genuinely cares about you, is endlessly proud of you, and wishes nothing but the best for you. I hope life treats you with the kindness you deserve and gives you more happiness than you could ever imagine. 🥹💗",
      "Happy Birthday to someone truly special! 🎂🌹 May your smile never fade, your heart never lose its beautiful warmth, and your life always be surrounded by love and blessings.",
      "I love you, today and always. ❤️💋🫶🏻"
    ],
    sign: true
  }
];

/* ==========================================================
   CODE (no need to edit below)
   ========================================================== */

const TOTAL_PAGES = 2 + LETTERS.length;
const stage = document.getElementById("stage");
const pages = [document.getElementById("page-0"), document.getElementById("page-1")];
let current = 0;
let celebrationStarted = false;
let celebrationDone = false;

const fill = (s) => s.replaceAll("{her}", HER_NAME).replaceAll("{me}", YOUR_NAME);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

/* ---------- Build letter pages ---------- */
LETTERS.forEach((letter, i) => {
  const pageIndex = i + 2;
  const section = el("section", "page");
  section.id = "page-" + pageIndex;
  section.setAttribute("aria-label", letter.title);

  const card = el("article", "letter");
  const head = el("div", "head");
  head.appendChild(el("div", "ornament", "\u2665 \u2665 \u2665"));
  head.appendChild(el("h2", "script", letter.title));
  card.appendChild(head);

  letter.paragraphs.forEach((p, idx) => {
    card.appendChild(el("p", idx === 0 ? "salutation" : "", fill(p)));
  });

  if (letter.sign) {
    const sig = el("p", "signoff");
    sig.appendChild(el("span", "script", fill(YOUR_NAME)));
    card.appendChild(sig);
  }

  section.appendChild(card);

  const nav = el("div", "nav");
  const prev = el("button", "btn ghost", "Previous");
  prev.type = "button";
  prev.addEventListener("click", () => go(pageIndex - 1));
  nav.appendChild(prev);

  if (pageIndex < TOTAL_PAGES - 1) {
    const next = el("button", "btn", "Next");
    next.type = "button";
    next.addEventListener("click", () => go(pageIndex + 1));
    nav.appendChild(next);
  }
  section.appendChild(nav);
  section.appendChild(el("p", "progress", "Page " + (pageIndex + 1) + " of " + TOTAL_PAGES));

  stage.appendChild(section);
  pages.push(section);
});

/* ---------- Page navigation ---------- */
function go(index) {
  if (index === current || index < 0 || index >= pages.length) return;
  const from = pages[current];
  const to = pages[index];
  from.classList.remove("active");
  from.classList.add("leaving");
  setTimeout(() => {
    from.classList.remove("leaving");
    to.classList.add("active");
    window.scrollTo({ top: 0, behavior: "auto" });
    const heading = to.querySelector("h1, h2");
    if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus({ preventScroll: true }); }
  }, 300);
  current = index;
}

pages[0].classList.add("active");
document.getElementById("next1").addEventListener("click", () => go(1));

/* ---------- Cake candles ---------- */
const CANDLE_X = [92, 121, 150, 179, 208];
const candlesGroup = document.getElementById("candles");
const NS = "http://www.w3.org/2000/svg";
const candleEls = CANDLE_X.map((x, i) => {
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "candle");
  g.innerHTML =
    '<rect x="' + (x - 4) + '" y="68" width="8" height="34" rx="2" fill="' + (i % 2 ? "#fff" : "#f7c6cf") + '" stroke="#e8aab6" stroke-width="1"/>' +
    '<path d="M' + (x - 4) + ' 78 l8 6 M' + (x - 4) + ' 88 l8 6" stroke="#d9607a" stroke-width="2" opacity=".6"/>' +
    '<g transform="translate(' + x + ' 62)">' +
      '<circle class="glow" r="15" cy="-8" fill="#ffd98a" opacity=".45"/>' +
      '<path class="flame" d="M0 -20 C 8 -10 8 0 0 3 C -8 0 -8 -10 0 -20Z" fill="#ffb84d"/>' +
      '<path class="flame" d="M0 -11 C 4 -6 4 -1 0 1 C -4 -1 -4 -6 0 -11Z" fill="#fff3c4"/>' +
      '<path class="smoke" d="M0 -6 c-6 -8 6 -14 0 -22"/>' +
    '</g>';
  candlesGroup.appendChild(g);
  return g;
});

function blowOut(done) {
  candleEls.forEach((c, i) => {
    setTimeout(() => c.classList.add("puff"), i * 650);
    setTimeout(() => c.classList.add("out"), i * 650 + 320);
  });
  setTimeout(done, candleEls.length * 650 + 900);
}

/* ---------- Countdown ---------- */
const target = new Date(BIRTHDAY_DATE).getTime();
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");

function startCelebration() {
  if (celebrationStarted) return;
  celebrationStarted = true;
  clearInterval(timer);
  $("countdownBlock").style.display = "none";
  $("celebration").classList.add("show");
  $("hbName").textContent = "To " + HER_NAME + ", with all my love";
  // Candles burn for a moment, then are blown out one after another.
  setTimeout(() => {
    blowOut(() => {
      $("hbText").classList.add("show");
      setTimeout(() => {
        $("next1").classList.add("show");
        celebrationDone = true;
      }, 1400);
    });
  }, 3000);
}

function tick() {
  const diff = target - Date.now();
  if (isNaN(target) || diff <= 0) { startCelebration(); return; }
  const s = Math.floor(diff / 1000);
  if (typeof finalPulse === "function") finalPulse(s);
  $("cd-days").textContent  = pad(Math.floor(s / 86400));
  $("cd-hours").textContent = pad(Math.floor((s % 86400) / 3600));
  $("cd-mins").textContent  = pad(Math.floor((s % 3600) / 60));
  $("cd-secs").textContent  = pad(s % 60);
}
const timer = setInterval(tick, 1000);
tick();

/* ---------- Countdown messages ---------- */
// Edit or add your own small messages here. {her} is replaced with her name.
const COUNTDOWN_MESSAGES = [
  "Every tick of the clock brings me closer to your smile 💕",
  "Somebody very special is about to be celebrated 🎉",
  "I'm counting every second until your day begins ⏳💖",
  "Good things come to those who wait, and you are the best thing 🌹",
  "I've got a little surprise waiting just for you 🎁",
  "Thinking of you right now, as always 🥰",
  "Your day is almost here, {her} ✨",
  "Hold on tight, the magic is coming 🪄💫"
];
const FINAL_MESSAGES = {
  minute: "Almost there... get ready, my love! 🎂💗",
  hour: "Less than an hour to go! My heart is racing 💓"
};
let msgIndex = Math.floor(Math.random() * COUNTDOWN_MESSAGES.length);
function showMessage(text) {
  const m = $("cdMsg");
  m.classList.add("fade");
  setTimeout(() => { m.textContent = fill(text); m.classList.remove("fade"); }, 600);
}
function nextMessage() {
  const diff = target - Date.now();
  if (diff <= 0) return;
  if (diff < 60000) showMessage(FINAL_MESSAGES.minute);
  else if (diff < 3600000) showMessage(FINAL_MESSAGES.hour);
  else { msgIndex = (msgIndex + 1) % COUNTDOWN_MESSAGES.length; showMessage(COUNTDOWN_MESSAGES[msgIndex]); }
}
$("cdMsg").textContent = fill(COUNTDOWN_MESSAGES[msgIndex]);
const msgTimer = setInterval(() => { if (celebrationStarted) clearInterval(msgTimer); else nextMessage(); }, 5000);
// Numbers pulse during the final 10 seconds
function finalPulse(secondsLeft) {
  document.querySelectorAll(".unit").forEach(u => u.classList.toggle("pulse", secondsLeft <= 10));
}

/* ---------- Envelope ---------- */
$("envTo").textContent = "For " + HER_NAME;
$("envelope").addEventListener("click", () => {
  const env = $("envelope");
  if (env.classList.contains("open")) return;
  env.classList.add("open");
  $("envHint").classList.add("hide");
  setTimeout(() => $("next2").classList.add("show"), 1700);
});
$("next2").addEventListener("click", () => go(2));
$("prev2").addEventListener("click", () => go(0));

/* ---------- Floating hearts (decoration) ---------- */
(function hearts() {
  const box = $("hearts");
  const count = window.innerWidth < 600 ? 10 : 18;
  for (let i = 0; i < count; i++) {
    const h = document.createElement("span");
    h.textContent = "\u2665";
    h.style.left = Math.random() * 100 + "%";
    h.style.fontSize = 12 + Math.random() * 20 + "px";
    h.style.animationDuration = 12 + Math.random() * 14 + "s";
    h.style.animationDelay = -Math.random() * 20 + "s";
    box.appendChild(h);
  }
})();
</script>
